version: 2
updates:
  # npm（pnpm ワークスペース）。ルートの1件で apps/*・packages/* を横断
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # 公開直後のバージョンは配布ファイルの反映待ちでインストールに失敗しうる → 2日待つ
    cooldown:
      default-days: 2
    commit-message:
      prefix: build
      include: scope
    groups:
      # minor・patch は1つの PR にまとめる（major は個別の PR でレビュー）
      minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10

  # GitHub Actions（.github/workflows のアクション）
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"
